name: Playwright UI Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/society-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/society-web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend/society-web

      - name: Run Playwright Tests
        run: npx playwright test --project=chromium
        working-directory: frontend/society-web
        env:
          BASE_URL: ${{ secrets.STAGING_URL || 'https://society-saas-web.azurewebsites.net' }}
          SOCIETY_EMAIL: ${{ secrets.SOCIETY_EMAIL }}
          SOCIETY_PASSWORD: ${{ secrets.SOCIETY_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/society-web/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: frontend/society-web/test-results/
          retention-days: 30

name: Society SaaS CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore .NET dependencies
        run: dotnet restore
        working-directory: backend

      - name: Build .NET solution
        run: dotnet build --configuration Release --no-restore
        working-directory: backend

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend/society-web

      - name: Build frontend
        run: npm run build
        working-directory: frontend/society-web
        env:
          CI: false

  ui-tests:
    name: Playwright UI Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/society-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/society-web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend/society-web

      - name: Run Playwright Tests
        run: npx playwright test --project=chromium
        working-directory: frontend/society-web
        env:
          BASE_URL: https://society-saas-web.azurewebsites.net
          SOCIETY_EMAIL: ${{ secrets.SOCIETY_EMAIL }}
          SOCIETY_PASSWORD: ${{ secrets.SOCIETY_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/society-web/playwright-report/
          retention-days: 30

  deploy:
    name: Deploy to Azure
    needs: [build, ui-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Publish API
        run: |
          dotnet publish backend/SocietySaaS.API/SocietySaaS.API.csproj \
            -c Release \
            -o ${{ github.workspace }}/api-output

      - name: Deploy API to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: society-saas-api
          package: ${{ github.workspace }}/api-output

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend/society-web

      - name: Build Frontend
        run: npm run build
        working-directory: frontend/society-web
        env:
          CI: false

      - name: Prepare Frontend for Deployment
        run: |
          cp frontend/society-web/startup.js frontend/society-web/build/startup.js
          cp frontend/society-web/web.config frontend/society-web/build/web.config
          echo '{"name":"society-web","version":"1.0.0","private":true,"scripts":{"start":"node startup.js"},"engines":{"node":">=18.0.0"}}' > frontend/society-web/build/package.json

      - name: Deploy Frontend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: society-saas-web
          package: frontend/society-web/build

      - name: Logout from Azure
        run: az logout
        if: always()
